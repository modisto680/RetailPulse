# ============================================================
# RetailPulse — environnement de développement local (Docker Compose)
# Déploiement Kubernetes complet : voir k8s/ et docs/installation.md
# Usage : cp .env.example .env && docker compose up --build
# ============================================================
name: retailpulse

services:
  # ----------------------------------------------------------
  # Apache Kafka 4.0 en mode KRaft (sans ZooKeeper)
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092" # accès depuis l'hôte (PLAINTEXT_HOST)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Un seul broker local : RF = 1 (aucune autre machine pour héberger une copie)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ----------------------------------------------------------
  # Création des topics (une seule fois, idempotent)
  # ----------------------------------------------------------
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      KAFKA_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
    volumes:
      - ./kafka/topics.sh:/scripts/topics.sh:ro
    restart: "no"

  # ----------------------------------------------------------
  # PostgreSQL (référentiels, commandes, agrégats)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retailpulse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ----------------------------------------------------------
  # Collecteur DummyJSON -> topics Kafka de référence (Job)
  # ----------------------------------------------------------
  collector:
    build: ./collector
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PRODUCTS: ${KAFKA_TOPIC_PRODUCTS:-retail-products}
      KAFKA_TOPIC_CUSTOMERS: ${KAFKA_TOPIC_CUSTOMERS:-retail-customers}
      DUMMYJSON_BASE_URL: ${DUMMYJSON_BASE_URL:-https://dummyjson.com}
      DUMMYJSON_TIMEOUT_SECONDS: ${DUMMYJSON_TIMEOUT_SECONDS:-30}
    restart: "no"

  # ----------------------------------------------------------
  # Reference Loader : topics Kafka -> PostgreSQL (upsert, Job)
  # ----------------------------------------------------------
  reference-loader:
    build: ./reference_loader
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      collector:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PRODUCTS: ${KAFKA_TOPIC_PRODUCTS:-retail-products}
      KAFKA_TOPIC_CUSTOMERS: ${KAFKA_TOPIC_CUSTOMERS:-retail-customers}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
    restart: "no"

  # ----------------------------------------------------------
  # Producteur : simulation continue des commandes et paiements
  # ----------------------------------------------------------
  producer:
    build: ./producer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      reference-loader:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-retail-orders}
      KAFKA_TOPIC_ORDER_EVENTS: ${KAFKA_TOPIC_ORDER_EVENTS:-retail-order-events}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      PRODUCER_MIN_INTERVAL_MS: ${PRODUCER_MIN_INTERVAL_MS:-500}
      PRODUCER_MAX_INTERVAL_MS: ${PRODUCER_MAX_INTERVAL_MS:-2000}
      PRODUCER_PAYMENT_COMPLETED_RATE: ${PRODUCER_PAYMENT_COMPLETED_RATE:-0.85}
      PRODUCER_PAYMENT_FAILED_RATE: ${PRODUCER_PAYMENT_FAILED_RATE:-0.10}
      PRODUCER_DUPLICATE_RATE: ${PRODUCER_DUPLICATE_RATE:-0.0}
      PRODUCER_MAX_ITEMS_PER_ORDER: ${PRODUCER_MAX_ITEMS_PER_ORDER:-4}

  # ----------------------------------------------------------
  # Spark Structured Streaming : traitement continu
  # ----------------------------------------------------------
  spark:
    build: ./spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-retail-orders}
      KAFKA_TOPIC_ORDER_EVENTS: ${KAFKA_TOPIC_ORDER_EVENTS:-retail-order-events}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-retail-events-dlq}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      SPARK_WATERMARK_DELAY: ${SPARK_WATERMARK_DELAY:-10 minutes}
      SPARK_WINDOW_DURATION: ${SPARK_WINDOW_DURATION:-5 minutes}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-10 seconds}
      SPARK_CHECKPOINT_DIR: /opt/spark/checkpoint
    volumes:
      - spark-checkpoint:/opt/spark/checkpoint

  # ----------------------------------------------------------
  # Dashboard Streamlit (indicateurs quasi temps réel)
  # ----------------------------------------------------------
  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-10}

volumes:
  kafka-data:
  postgres-data:
  spark-checkpoint:
