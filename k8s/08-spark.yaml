# ============================================================
# Deployment : Spark Structured Streaming.
# PVC dédié au checkpoint : reprise garantie après redémarrage du Pod.
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoint
  namespace: retailpulse
  labels:
    app.kubernetes.io/part-of: retailpulse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark
  namespace: retailpulse
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/part-of: retailpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark
        app.kubernetes.io/part-of: retailpulse
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: spark
          image: retailpulse/spark-streaming:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: retailpulse-config
            - secretRef:
                name: retailpulse-postgres
          volumeMounts:
            - name: checkpoint
              mountPath: /opt/spark/checkpoint
          resources: # Spark est le composant le plus gourmand (JVM + état)
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: checkpoint
          persistentVolumeClaim:
            claimName: spark-checkpoint
