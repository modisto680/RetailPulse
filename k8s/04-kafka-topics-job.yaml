# ============================================================
# Job : création des topics Kafka (idempotent, --if-not-exists).
# Partitionnement : 3 partitions par topic, RF=1 (broker unique).
# Justification des clés / partitions : docs/architecture.md.
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: retailpulse
  labels:
    app.kubernetes.io/part-of: retailpulse
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: retailpulse
    spec:
      restartPolicy: Never
      containers:
        - name: topics-init
          image: apache/kafka:4.0.0
          env:
            - name: BOOTSTRAP
              value: "kafka:29092"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              TOPICS="retail-products retail-customers retail-orders retail-order-events retail-events-dlq"
              for T in $TOPICS; do
                echo ">>> création du topic $T (3 partitions, RF=1)"
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BOOTSTRAP \
                  --create --if-not-exists --topic $T \
                  --partitions 3 --replication-factor 1
              done
              echo ">>> topics existants :"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server $BOOTSTRAP --list
