# ============================================================
# Job : Reference Loader — topics Kafka -> PostgreSQL (upsert).
# Attente de PostgreSQL prête via initContainer pg_isready.
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: reference-loader
  namespace: retailpulse
  labels:
    app.kubernetes.io/part-of: retailpulse
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reference-loader
        app.kubernetes.io/part-of: retailpulse
    spec:
      restartPolicy: Never
      initContainers: # PostgreSQL doit être prêt avant de charger
        - name: wait-postgres
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: retailpulse-config
            - secretRef:
                name: retailpulse-postgres
          command: ["sh", "-c"]
          args:
            - until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER; do
                echo "attente de PostgreSQL..."; sleep 3;
              done
      containers:
        - name: reference-loader
          image: retailpulse/reference-loader:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: retailpulse-config
            - secretRef:
                name: retailpulse-postgres
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
