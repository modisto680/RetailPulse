# ============================================================
# Apache Kafka 4.0 — StatefulSet KRaft (SANS ZooKeeper) + Service + PVC.
# Broker unique en mode combiné (broker+controller) : RF=1 justifié par
# l'absence d'un second broker (cahier des charges §6.4).
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: retailpulse
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: retailpulse
spec:
  clusterIP: None # headless : le DNS `kafka` pointe vers le Pod (listener
  selector:        # annoncé kafka:29092 utilisable depuis tous les composants)
    app.kubernetes.io/name: kafka
  ports:
    - name: internal # trafic inter-composants
      port: 29092
      targetPort: 29092
    - name: controller # quorum KRaft
      port: 29093
      targetPort: 29093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: retailpulse
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: retailpulse
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: retailpulse
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - containerPort: 29092
              name: internal
            - containerPort: 29093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES # KRaft : broker + controller combinés
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:29093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Broker unique : facteurs de réplication internes forcés à 1.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false" # topics créés explicitement (Job dédié)
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe: # prêt seulement si le broker répond aux requêtes
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
  volumeClaimTemplates: # PVC : journaux persistants, survit aux reprises
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
