# ============================================================
# PostgreSQL — StatefulSet + Service + PVC (identité stable et données)
# Le schéma est chargé au premier démarrage via la ConfigMap
# `retailpulse-postgres-init` (voir k8s/README.md, commande de génération).
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: retailpulse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: retailpulse
spec:
  clusterIP: None # headless : DNS stable postgres-0.postgres
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: retailpulse
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: retailpulse
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: retailpulse
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - configMapRef:
                name: retailpulse-config
            - secretRef:
                name: retailpulse-postgres
          # POSTGRES_USER/PASSWORD/DB sont injectés par le Secret/ConfigMap.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d/01_schema.sql
              subPath: 01_schema.sql
              readOnly: true
          readinessProbe: # prêt seulement si PostgreSQL accepte les connexions
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: init-schema
          configMap:
            name: retailpulse-postgres-init
            items:
              - key: 01_schema.sql
                path: 01_schema.sql
  volumeClaimTemplates: # PVC : persistance des données entre redémarrages
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
